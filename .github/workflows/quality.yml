name: Snarky How-To Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-and-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/snarky-how-to/index.ts
          deno check supabase/functions/snarky-youtube/index.ts

      - name: Validate video production source
        run: |
          python -m py_compile tools/snarky_video_factory.py
          python - <<'PY'
          import json
          from pathlib import Path

          for number in range(1, 8):
              episode = Path(f"content/youtube/episode-{number:03d}")
              scenes_path = episode / "scenes.json"
              data = json.loads(scenes_path.read_text(encoding="utf-8"))
              for mode, expected_size in (("full", [1920, 1080]), ("short", [1080, 1920])):
                  package = data.get(mode)
                  assert isinstance(package, dict), f"{scenes_path}: missing {mode}"
                  assert package.get("size") == expected_size, f"{scenes_path}: bad {mode} size"
                  assert package.get("slug"), f"{scenes_path}: missing {mode} slug"
                  scenes = package.get("scenes")
                  assert isinstance(scenes, list) and scenes, f"{scenes_path}: empty {mode} scenes"
                  for index, scene in enumerate(scenes, 1):
                      assert str(scene.get("title", "")).strip(), f"{scenes_path}: {mode} scene {index} missing title"
                      assert str(scene.get("voice", "")).strip(), f"{scenes_path}: {mode} scene {index} missing voice"
                  srt = episode / f"{mode}.srt"
                  assert srt.is_file() and srt.stat().st_size > 0, f"{srt}: missing/empty"
          print("episodes 001-007 source packages: PASS")
          PY

      - name: Verify discovery and truth contracts
        run: |
          grep -q 'HowTo' supabase/functions/snarky-how-to/index.ts
          grep -q 'No income guarantees' supabase/functions/snarky-how-to/index.ts
          grep -q 'Sarcasm is aimed at the situation' supabase/functions/snarky-how-to/index.ts
          grep -q 'youtube_entry' supabase/functions/snarky-youtube/index.ts
          grep -q 'snarky_001_full' supabase/functions/snarky-youtube/index.ts
          grep -q 'snarky_001_short' supabase/functions/snarky-youtube/index.ts

      - name: Verify live guide
        run: |
          curl --fail --silent --show-error --location \
            https://nqcshihyfhthywpseilx.supabase.co/functions/v1/snarky-how-to \
            | grep -q 'Do not build the empire before the invoice'

      - name: Verify YouTube tracking redirect
        run: |
          headers=$(curl --fail --silent --show-error --head \
            'https://nqcshihyfhthywpseilx.supabase.co/functions/v1/snarky-youtube?campaign=snarky_001_full')
          echo "$headers" | grep -qi '^location:.*from=youtube.*campaign=snarky_001_full'
